<script>
  // useIsPhone phoneMode(), as the app sets it before the first paint: a 720px-wide window, or a touch screen whose short side is 640 or less.
  (() => {
    const touchPhone = Math.min(screen.width, screen.height) <= 640 && matchMedia('(pointer: coarse)').matches;
    const phone = touchPhone || matchMedia('(max-width: 720px)').matches;
    const mode = !phone ? '' : touchPhone && (screen.orientation?.type ?? '').startsWith('landscape') ? 'landscape' : 'portrait';
    if (mode) document.documentElement.setAttribute('data-phone', mode);
  })();
</script>

<script>
  const t = (id) => document.getElementById(id).innerHTML;
  const q = location.search;
  const phone = document.documentElement.hasAttribute('data-phone');
  const hidden = !phone && (q.includes('hidden') || q.includes('peek'));
  const peek = !phone && q.includes('peek');
  const inHead = !phone && (!hidden || peek);
  const toggle = t('toggle').replace('aria-pressed="true"', `aria-pressed="${!hidden}"`);
  const wrap = document.createElement('div');
  wrap.className = `sidebar-wrap${phone ? ' drawer' : ''}${hidden ? ' hidden' : ''}${peek ? ' peek' : ''}`;
  wrap.innerHTML = t('sidebar');
  if (inHead) wrap.querySelector('.sidebar-head').insertAdjacentHTML('afterbegin', toggle);
  const app = document.querySelector('.app');
  // One place at every width (App): before the body column; on a phone the same element is the fixed drawer.
  app.insertBefore(wrap, app.querySelector('.main-col'));
  const bar = document.querySelector('.topbar');
  if (!phone && !hidden) bar.classList.add('beside-sidebar');
  const chip = `<div class="pane-head in-topbar"><div class="pane-head-main with-avatar${phone ? '' : ' with-folder'}"><span class="head-chip-wrap"><button type="button" class="head-chip" aria-haspopup="menu" aria-expanded="false">${t('avatar')}<span class="head-chip-text"><span class="head-chip-title"><span class="head-chip-name">결제 서비스</span></span>${phone ? '' : '<span class="head-chip-spacer" aria-hidden="true"></span>'}</span>${t('caret')}</button></span>${phone ? '' : '<button type="button" class="folder-chip head-folder">payments</button>'}</div></div>`;
  bar.innerHTML = (phone ? t('menu') : inHead ? (hidden ? '<span class="sidebar-toggle-spacer" aria-hidden="true"></span>' : '') : toggle)
    + `<div class="topbar-head">${chip}</div>` + (phone ? '' : t('strip')) + t('end').replace('<div class="topbar-end">', `<div class="topbar-end">${phone ? '' : t('split')}`);
</script>
