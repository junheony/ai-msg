<!doctype html><html><head><meta charset="utf-8">
<!-- 활동 점 states fixture for scripts/render-check.sh (keep in step with ActivityButton.tsx / ActivitySheet.tsx):
     the top bar's dot in six states — 없음 (빈 고리), 실행 중 (도는 호), 백그라운드, 승인 대기 2, 서버 재시작 대기,
     연결 끊김 (빗금 친 빈 고리, with the banner) —
     and the sheet open on the 승인 대기 2 state. Taller than the default window: RENDER_HEIGHT=900. -->
<link rel="stylesheet" href="../../src/ui/styles.css">
<script>
  // useIsPhone phoneMode(), as the app sets it before the first paint: a 720px-wide window, or a touch screen whose short side is 640 or less.
  (() => {
    const touchPhone = Math.min(screen.width, screen.height) <= 640 && matchMedia('(pointer: coarse)').matches;
    const phone = touchPhone || matchMedia('(max-width: 720px)').matches;
    const mode = !phone ? '' : touchPhone && (screen.orientation?.type ?? '').startsWith('landscape') ? 'landscape' : 'portrait';
    if (mode) document.documentElement.setAttribute('data-phone', mode);
  })();
</script>
<style>
  body { margin: 0; background: var(--bg); }
  .fx { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .fx-states { flex: 1 1 360px; min-width: 0; }
  .fx-states .topbar { height: 52px; }
  .fx-name { font-size: 13px; color: var(--muted); }
  .fx .sheet.activity-sheet { flex: 0 0 auto; }
</style>
</head><body>
<div class="fx">
<div class="fx-states">
  <div class="topbar"><span class="fx-name">없음</span><div class="topbar-end">
    <button type="button" class="activity-btn lvl-idle" aria-label="활동"><svg class="activity-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span class="activity-dot"></span></button>
  </div></div>
  <div class="topbar"><span class="fx-name">실행 중 1</span><div class="topbar-end">
    <button type="button" class="activity-btn lvl-running" aria-label="활동 · 실행 중 1"><svg class="activity-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span class="activity-dot"></span></button>
  </div></div>
  <div class="topbar"><span class="fx-name">백그라운드 1</span><div class="topbar-end">
    <button type="button" class="activity-btn lvl-bg" aria-label="활동 · 백그라운드 1"><svg class="activity-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span class="activity-dot"></span></button>
  </div></div>
  <div class="topbar"><span class="fx-name">승인 대기 2 · 실행 중 1</span><div class="topbar-end">
    <button type="button" class="activity-btn lvl-waiting" aria-label="활동 · 승인 대기 2 · 실행 중 1"><svg class="activity-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span class="activity-dot"></span><span class="activity-badge">2</span></button>
  </div></div>
  <div class="topbar"><span class="fx-name">서버 재시작 대기</span><div class="topbar-end">
    <button type="button" class="activity-btn lvl-server" aria-label="활동 · 서버 재시작 대기"><svg class="activity-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span class="activity-dot"></span><span class="activity-ring">↻</span></button>
  </div></div>
  <div class="topbar"><span class="fx-name">연결 끊김</span><div class="topbar-end">
    <button type="button" class="activity-btn lvl-down" aria-label="활동 · 연결 끊김"><svg class="activity-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span class="activity-dot"></span></button>
  </div></div>
  <div class="conn-down" role="status"><span>서버에 연결할 수 없어요 · 00:25부터 — 연결되면 자동으로 이어집니다</span><button type="button" class="text-btn">다시 시도</button></div>
</div>

<div class="sheet activity-sheet" role="dialog" aria-label="활동"><div class="act-inner">
  <header class="sheet-head"><h2 class="sheet-title">활동</h2><button type="button" class="icon-btn sheet-btn sheet-close" aria-label="닫기" title="닫기 (Esc)">✕</button></header>
  <section class="act-sec" aria-label="승인 대기 2"><h3 class="act-sec-title">승인 대기 2</h3>
    <div class="act-card">
      <button type="button" class="act-row act-card-head"><span class="act-title">two</span><b class="act-wait">열기</b></button>
      <div class="permission-card" role="group"><div class="permission-head"><span class="dot"></span>권한 요청 <strong>Bash</strong></div>
        <div class="permission-scope muted">세션 s2 · /w/two</div><pre>npm test</pre>
        <div class="permission-actions"><button type="button" class="btn deny">거부</button><button type="button" class="btn primary">허용 1회</button></div></div>
    </div>
    <div class="act-card">
      <button type="button" class="act-row act-card-head"><span class="act-title">새 대화</span><b class="act-wait">열기</b></button>
      <div class="permission-card" role="group"><div class="permission-head"><span class="dot"></span>권한 요청 <strong>Edit</strong></div>
        <div class="permission-scope muted">새 세션 · /w</div><pre>src/app.ts</pre>
        <div class="permission-actions"><button type="button" class="btn deny">거부</button><button type="button" class="btn primary">허용 1회</button></div></div>
    </div>
  </section>
  <section class="act-sec" aria-label="실행 중 1"><h3 class="act-sec-title">실행 중 1</h3>
    <div class="act-item"><button type="button" class="act-row"><span class="act-title">one</span><b>실행 중</b></button><button type="button" class="btn ghost act-stop">중단</button></div>
  </section>
  <section class="act-sec" aria-label="백그라운드"><h3 class="act-sec-title">백그라운드</h3>
    <button type="button" class="act-row"><span class="act-title">three</span><b>백그라운드 1</b></button>
    <div class="act-sub"><div class="act-title">· dev server</div></div>
  </section>
  <button type="button" class="act-row act-link"><span class="act-title">하이라이트 4</span><b>보기 →</b></button>
  <section class="act-sec" aria-label="서버"><h3 class="act-sec-title">서버</h3>
    <div class="act-line">서버 · 3시간째</div>
  </section>
  <div class="act-line act-notify"><span>이 기기 알림 설정</span><button type="button" class="text-btn">알림</button></div>
</div></div>
</div>
</body></html>
