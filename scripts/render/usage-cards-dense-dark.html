<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<!-- Compact/dense card fixture for scripts/render-check.sh (keep in step with UsagePanel.tsx): the
     `.usage-panel[data-dense]` switch useCramped flips when the full cards would overflow — same
     markup as usage-cards.html, just forced on so it renders regardless of width.
     Forced to the dark theme. See usage-cards-dense.html for the light theme. -->
<link rel="stylesheet" href="../../src/ui/styles.css">
<style>body { margin: 0; }</style>
</head><body>
<div class="topbar" style="width:auto"><div class="usage-panel" data-dense style="--usage-cards:4">
<div class="usage-card claude ok" title="A · 21% 남음">
  <div class="usage-id"><svg class="usage-mark claude" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#d97757"/></svg><span class="usage-letter">A</span></div>
  <span class="usage-sum ok" aria-hidden="true">21<small>%</small></span>
  <div class="usage-rows">
    <div class="usage-row ok"><span class="usage-label">5h</span><span class="usage-bar" aria-hidden="true"><i style="width:100%"></i></span><span class="usage-value">100<small>%</small></span></div>
    <div class="usage-row ok"><span class="usage-label">주간</span><span class="usage-bar" aria-hidden="true"><i style="width:21%"></i></span><span class="usage-value">21<small>%</small></span></div>
    <div class="usage-row warn estimated"><span class="usage-label">Fable</span><span class="usage-bar" aria-hidden="true"><i style="width:14%"></i></span><span class="usage-value">14<small>%</small></span></div>
  </div>
</div>
<div class="usage-card claude ok current" title="B · 60% 남음">
  <div class="usage-id"><svg class="usage-mark claude" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#d97757"/></svg><span class="usage-letter">B</span></div>
  <span class="usage-sum ok" aria-hidden="true">60<small>%</small></span>
  <div class="usage-rows">
    <div class="usage-row ok"><span class="usage-label">5h</span><span class="usage-bar" aria-hidden="true"><i style="width:60%"></i></span><span class="usage-value">60<small>%</small></span></div>
    <div class="usage-row ok"><span class="usage-label">주간</span><span class="usage-bar" aria-hidden="true"><i style="width:64%"></i></span><span class="usage-value">64<small>%</small></span></div>
    <div class="usage-row ok"><span class="usage-label">Fable</span><span class="usage-bar" aria-hidden="true"><i style="width:50%"></i></span><span class="usage-value">50<small>%</small></span></div>
  </div>
  <span class="usage-next">다음 턴</span>
</div>
<div class="usage-card claude ok" title="C · 다음 턴 · Opus">
  <div class="usage-id"><svg class="usage-mark claude" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#d97757"/></svg><span class="usage-letter">C</span></div>
  <span class="usage-sum danger" aria-hidden="true">소진</span>
  <div class="usage-rows">
    <div class="usage-row spent danger"><span class="usage-label">5h</span><span class="usage-pill">소진<span class="usage-pill-at"> · 23:10</span></span></div>
    <div class="usage-row ok"><span class="usage-label">주간</span><span class="usage-bar" aria-hidden="true"><i style="width:60%"></i></span><span class="usage-value">60<small>%</small></span></div>
    <div class="usage-row ok"><span class="usage-label">Fable</span><span class="usage-bar" aria-hidden="true"><i style="width:49%"></i></span><span class="usage-value">49<small>%</small></span></div>
  </div>
  <span class="usage-next">다음 턴 · Opus</span>
</div>
<div class="usage-card gpt ok" title="GPT · 41% 남음">
  <div class="usage-id"><svg class="usage-mark gpt" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#ddd"/></svg><span class="usage-letter">GPT</span></div>
  <span class="usage-sum ok" aria-hidden="true">41<small>%</small></span>
  <div class="usage-rows">
    <div class="usage-row ok"><span class="usage-label">주간</span><span class="usage-bar" aria-hidden="true"><i style="width:41%"></i></span><span class="usage-value">41<small>%</small></span></div>
    <div class="usage-row none"><span class="usage-label">5h</span><span class="usage-bar" aria-hidden="true"><i style="width:0%"></i></span><span class="usage-value">—</span></div>
    <div class="usage-row credits"><span class="usage-label">크레딧</span><span class="usage-credits">3,723</span></div>
  </div>
</div>
</div></div>
</body></html>
