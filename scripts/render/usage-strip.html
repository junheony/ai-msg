<script>
// The page shows itself twice in frames, dark then light (the light tokens only apply on the root element).
const want = location.hash.slice(1);
if (!want) {
  document.body.innerHTML = '<iframe src="#dark"></iframe><iframe src="#light"></iframe>';
} else {
  document.documentElement.dataset.theme = want;
  document.getElementById(want === 'dark' ? 'light' : 'dark').remove();
}
// barRoom + pickStage of UsageStrip.tsx, run once per auto top bar: the bar's inner width less the other items, the
// session chip's min-width and the gaps (the strip counted as an item); the strip takes only its stage's width.
for (const w of document.querySelectorAll('[data-auto]')) {
  const bar = w.closest('.topbar');
  const m = bar.querySelector('.usage-strip-measure');
  const kids = [...m.children];
  const need = kids.map((k) => k.getBoundingClientRect().width);
  const px = (v) => parseFloat(v) || 0;
  const cs = getComputedStyle(bar);
  let room = bar.clientWidth - px(cs.paddingLeft) - px(cs.paddingRight), items = 1;
  for (const el of bar.children) {
    if (el === w || el === m) continue;
    const e = getComputedStyle(el);
    if (e.display === 'none' || e.position === 'fixed' || e.position === 'absolute') continue;
    items++;
    room -= el.classList.contains('topbar-head') ? px(e.minWidth) : el.getBoundingClientRect().width;
  }
  room -= (items - 1) * px(cs.columnGap || cs.gap);
  // A phone (≤720px) always has the line, as App renders it.
  const i = matchMedia('(max-width: 720px)').matches ? -1 : need.findIndex((n) => room >= n);
  const btn = w.querySelector('button.usage-strip');
  if (i < 0) {
    // Not even min fits: nothing in the bar (the box only measures), every seat in the line under it.
    const row = document.createElement('div');
    row.className = 'usage-strip-row';
    btn.innerHTML = kids[1].innerHTML;
    row.append(btn);
    w.remove();
    bar.after(row);
    w.dataset.stage = 'row';
  }
  else { btn.innerHTML = kids[i].innerHTML; w.dataset.stage = ['full', 'mid', 'min'][i]; }
  bar.closest('figure').querySelector('figcaption').textContent += ' → ' + w.dataset.stage;
}
</script>
