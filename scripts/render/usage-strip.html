<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<!-- Usage strip fixture for scripts/render-check.sh. The header pill is the tightest seat. The popover is every seat
     at full (label · bar · remaining % · reset). Dark first, then light (the page loads itself twice in frames). -->
<link rel="stylesheet" href="../../src/ui/styles.css">
<style>
body { margin: 0; background: var(--sidebar); color: var(--fg); }
.theme { padding: 6px 0 10px; background: var(--sidebar); color: var(--fg); }
h2 { margin: 0 8px 4px; font-size: 12px; color: var(--muted); }
figure { margin: 0 0 10px; }
figcaption { margin: 0 8px 2px; font-size: 11px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px; align-items: center; }
.phone { width: 390px; max-width: 100%; margin-left: 8px; box-shadow: 0 0 0 1px var(--line-strong); }
.topbar { height: 64px; }
iframe { display: block; width: 100%; height: 900px; border: 0; }
</style>
</head><body>
<div id="dark"><section class="theme"><h2>다크</h2>
<figure><figcaption>상단바 · 접힌 요약 (6석 중 가장 빠듯한 자리)</figcaption>
<header class="topbar"><div class="topbar-head"><div class="head-chip-wrap"><span class="head-chip static"><span class="head-chip-title">사용량 요약 픽스처 세션</span></span></div></div><div class="usage-strip-wrap" data-summary=""><button type="button" class="usage-strip spent" aria-expanded="false" aria-label="계정별 남은 사용량"><span class="usage-summary"><span class="usage-seg-who">C</span><span class="usage-seg-bar"><i style="width:0%"></i></span><span class="usage-seg-num">소진</span></span><span class="usage-strip-caret" aria-hidden="true">▾</span></button></div><div class="topbar-end"><button class="icon-btn">⊞</button><button class="icon-btn">●</button></div></header></figure>
<figure><figcaption>펼침 · 6석 full (이름 · 막대 · 남은 % · 리셋)</figcaption>
<header class="topbar"><div class="topbar-head"><div class="head-chip-wrap"><span class="head-chip static"><span class="head-chip-title">사용량 요약 픽스처 세션</span></span></div></div><div class="usage-strip-wrap" data-summary=""><button type="button" class="usage-strip spent" aria-expanded="true" aria-label="계정별 남은 사용량"><span class="usage-summary"><span class="usage-seg-who">C</span><span class="usage-seg-bar"><i style="width:0%"></i></span><span class="usage-seg-num">소진</span></span><span class="usage-strip-caret" aria-hidden="true">▴</span></button><div class="usage-strip-pop" role="group" aria-label="계정별 남은 사용량"><span class="usage-seg ok" data-current=""><span class="usage-seg-who">A</span><span class="usage-seg-bar"><i style="width:58%"></i></span><span class="usage-seg-num">58%</span><span class="usage-seg-reset">2h</span></span><span class="usage-seg ok"><span class="usage-seg-next">→</span><span class="usage-seg-who">B</span><span class="usage-seg-bar"><i style="width:82%"></i></span><span class="usage-seg-num">82%</span><span class="usage-seg-reset">4h</span></span><span class="usage-seg spent"><span class="usage-seg-who">C</span><span class="usage-seg-bar"><i style="width:0%"></i></span><span class="usage-seg-num">소진</span><span class="usage-seg-reset">· 12m</span></span><span class="usage-seg warn"><span class="usage-seg-who">GPT</span><span class="usage-seg-bar"><i style="width:15%"></i></span><span class="usage-seg-num">15%</span><span class="usage-seg-reset">1h</span></span><span class="usage-seg danger"><span class="usage-seg-who">Gemini</span><span class="usage-seg-bar"><i style="width:3%"></i></span><span class="usage-seg-num">3%</span><span class="usage-seg-reset">40m</span></span><span class="usage-seg estimated"><span class="usage-seg-who">Grok</span><span class="usage-seg-bar"><i style="width:70%"></i></span><span class="usage-seg-num">70%</span><span class="usage-seg-reset">3d</span></span><button type="button" class="text-btn usage-strip-more">자세히</button></div></div><div class="topbar-end"><button class="icon-btn">⊞</button><button class="icon-btn">●</button></div></header></figure>
<figure><figcaption>폰 · 같은 한 줄 요약</figcaption>
<div class="phone"><header class="topbar"><button type="button" class="menu">☰</button><div class="topbar-head"><span class="head-chip static"><span class="head-chip-title">세션</span></span></div><div class="usage-strip-wrap" data-summary=""><button type="button" class="usage-strip warn" aria-expanded="false"><span class="usage-strip-head">남음</span><span class="usage-summary"><span class="usage-seg-who">GPT</span><span class="usage-seg-bar"><i style="width:15%"></i></span><span class="usage-seg-num">15%</span></span><span class="usage-strip-caret">▾</span></button></div><div class="topbar-end"><button class="icon-btn">●</button></div></header></div></figure>
<figure><figcaption>자리 상태 (펼친 행)</figcaption>
<div class="row"><div class="usage-strip"><span class="usage-seg ok"><span class="usage-seg-who">A</span><span class="usage-seg-bar"><i style="width:58%"></i></span><span class="usage-seg-num">58%</span><span class="usage-seg-reset">2h</span></span></div><div class="usage-strip"><span class="usage-seg warn"><span class="usage-seg-who">GPT</span><span class="usage-seg-bar"><i style="width:15%"></i></span><span class="usage-seg-num">15%</span><span class="usage-seg-reset">1h</span></span></div><div class="usage-strip"><span class="usage-seg danger"><span class="usage-seg-who">Gemini</span><span class="usage-seg-bar"><i style="width:3%"></i></span><span class="usage-seg-num">3%</span><span class="usage-seg-reset">40m</span></span></div><div class="usage-strip"><span class="usage-seg spent"><span class="usage-seg-who">C</span><span class="usage-seg-bar"><i style="width:0%"></i></span><span class="usage-seg-num">소진</span><span class="usage-seg-reset">· 12m</span></span></div><div class="usage-strip"><span class="usage-seg cooldown"><span class="usage-seg-who">Grok</span><span class="usage-seg-bar"><i style="width:0%"></i></span><span class="usage-seg-num">쿨다운</span><span class="usage-seg-reset">· 30m</span></span></div></div></figure>
</section></div>
<div id="light"></div>
<script>
const want = location.hash.slice(1);
if (!want) {
  document.body.innerHTML = '<iframe src="#dark"></iframe><iframe src="#light"></iframe>';
} else {
  document.documentElement.dataset.theme = want;
  if (want === 'light') {
    const src = document.getElementById('dark');
    const light = document.getElementById('light');
    light.innerHTML = src.innerHTML.replace('다크', '라이트');
    src.remove();
  } else document.getElementById('light').remove();
}
</script>
</body></html>
