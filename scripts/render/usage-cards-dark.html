<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<!-- Header account cards fixture for scripts/render-check.sh: the real stylesheet, hand-written markup
     (keep in step with UsagePanel.tsx: spent pill, GPT credits, 다음 턴 tag, usage-sum).
     Forced to the dark theme (data-theme) so the render is deterministic regardless of OS preference.
     render-check.sh's window is a fixed 160 CSS px tall, so each fixture holds exactly one .usage-panel row
     (a second row would be clipped off the bottom of the PNG) — see usage-cards-cli.html and
     usage-cards-dense.html for the other states, and the *-dark.html siblings for the dark theme. -->
<link rel="stylesheet" href="../../src/ui/styles.css">
<style>body { margin: 0; }</style>
</head><body>
<div class="topbar" style="width:auto"><div class="usage-panel" style="--usage-cards:4">
<div class="usage-card claude ok" title="A · 60% 남음 · 3시간 12분 후 리셋">
  <div class="usage-id"><svg class="usage-mark claude" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#d97757"/></svg><span class="usage-letter">A</span></div>
  <span class="usage-sum ok" aria-hidden="true">21<small>%</small></span>
  <div class="usage-rows">
    <div class="usage-row ok" title="5h · 100% 남음"><span class="usage-label">5h</span><span class="usage-bar" aria-hidden="true"><i style="width:100%"></i></span><span class="usage-value">100<small>%</small></span></div>
    <div class="usage-row ok" title="주간 · 21% 남음"><span class="usage-label">주간</span><span class="usage-bar" aria-hidden="true"><i style="width:21%"></i></span><span class="usage-value">21<small>%</small></span></div>
    <div class="usage-row warn" title="Fable · 14% 남음 · 8시간 후 리셋 · 노랑: 20% 이하 남음"><span class="usage-label">Fable</span><span class="usage-bar" aria-hidden="true"><i style="width:14%"></i></span><span class="usage-value">14<small>%</small></span><small class="usage-cd">8시간</small></div>
  </div>
</div>
<div class="usage-card claude ok current" title="B · 60% 남음">
  <div class="usage-id"><svg class="usage-mark claude" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#d97757"/></svg><span class="usage-letter">B</span></div>
  <span class="usage-sum ok" aria-hidden="true">60<small>%</small></span>
  <div class="usage-rows">
    <div class="usage-row ok" title="5h · 60% 남음"><span class="usage-label">5h</span><span class="usage-bar" aria-hidden="true"><i style="width:60%"></i></span><span class="usage-value">60<small>%</small></span></div>
    <div class="usage-row ok" title="주간 · 64% 남음"><span class="usage-label">주간</span><span class="usage-bar" aria-hidden="true"><i style="width:64%"></i></span><span class="usage-value">64<small>%</small></span></div>
    <div class="usage-row ok" title="Fable · 50% 남음 · 4일 후 리셋"><span class="usage-label">Fable</span><span class="usage-bar" aria-hidden="true"><i style="width:50%"></i></span><span class="usage-value">50<small>%</small></span><small class="usage-cd">4일</small></div>
  </div>
  <span class="usage-next" title="다음 턴은 이 계정으로 갑니다">다음 턴</span>
</div>
<div class="usage-card claude ok" title="C · 다음 턴 · Opus">
  <div class="usage-id"><svg class="usage-mark claude" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#d97757"/></svg><span class="usage-letter">C</span></div>
  <span class="usage-sum danger" aria-hidden="true">소진</span>
  <div class="usage-rows">
    <div class="usage-row spent danger" title="5h · 소진 · 23:10 리셋"><span class="usage-label">5h</span><span class="usage-pill">소진<span class="usage-pill-at"> · 23:10</span></span></div>
    <div class="usage-row ok" title="주간 · 60% 남음"><span class="usage-label">주간</span><span class="usage-bar" aria-hidden="true"><i style="width:60%"></i></span><span class="usage-value">60<small>%</small></span></div>
    <div class="usage-row ok" title="Fable · 49% 남음 · 2일 후 리셋"><span class="usage-label">Fable</span><span class="usage-bar" aria-hidden="true"><i style="width:49%"></i></span><span class="usage-value">49<small>%</small></span><small class="usage-cd">2일</small></div>
  </div>
  <span class="usage-next" title="다음 턴은 이 계정으로 갑니다: Opus 라우팅">다음 턴 · Opus</span>
</div>
<div class="usage-card gpt ok" title="GPT · 41% 남음 · 6일 후 리셋">
  <div class="usage-id"><svg class="usage-mark gpt" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#ddd"/></svg><span class="usage-letter">GPT</span></div>
  <span class="usage-sum ok" aria-hidden="true">41<small>%</small></span>
  <div class="usage-rows">
    <div class="usage-row ok" title="주간 · 41% 남음 · 6일 후 리셋"><span class="usage-label">주간</span><span class="usage-bar" aria-hidden="true"><i style="width:41%"></i></span><span class="usage-value">41<small>%</small></span><small class="usage-cd">6일</small></div>
    <div class="usage-row none" title="5h · 알 수 없음"><span class="usage-label">5h</span><span class="usage-bar" aria-hidden="true"><i style="width:0%"></i></span><span class="usage-value">—</span></div>
    <div class="usage-row credits" title="ChatGPT 크레딧 잔액"><span class="usage-label">크레딧</span><span class="usage-credits">3,723</span></div>
  </div>
</div>
</div></div>
</body></html>
